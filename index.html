<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a6e">
<meta name="mobile-web-app-capable" content="yes">
<script>
  // お客さま用（?m）のときは「ホーム画面に追加」を出さない
  if (!/[?&]m(=|&|$)/.test(location.search)) document.write('<link rel="manifest" href="manifest.json">');
</script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>多言語メニュー</title>
<style id="page-style">@page{size:A4;margin:10mm}</style>
<style>
:root{
  --bg:#f4f3ef; --card:#fff; --ink:#1f2328; --sub:#5d6670; --line:#e3e1db; --soft:#f7f6f2;
  --pri:#1f3a6e; --pri-weak:#e6ecf7; --ok:#14804a; --ok-weak:#e3f4ea; --bad:#c42e2e; --bad-weak:#fdebeb;
  --warn:#965a00; --warn-weak:#fff3dd; --nav:#1b2a44; --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Noto Sans JP","Noto Sans CJK JP","Hiragino Sans","Yu Gothic UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
#app{display:flex;min-height:100vh}
#print{display:none}
/* ---- サイドメニュー（横長） ---- */
.side{width:190px;flex-shrink:0;background:var(--nav);color:#fff;position:sticky;top:0;height:100vh;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top)) 10px 14px calc(10px + env(safe-area-inset-left))}
.side .brand{font-weight:700;font-size:17px;padding:6px 10px 14px;line-height:1.3;word-break:break-all}
.side .brand small{display:block;font-weight:400;font-size:12px;opacity:.7;margin-top:2px}
.side button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:#d3dbea;padding:12px;border-radius:10px;font-size:16px;text-align:left;cursor:pointer;min-height:48px;position:relative}
.side button.on{background:#33476b;color:#fff;font-weight:700}
.side hr{border:0;border-top:1px solid #33476b;margin:10px 4px}
.dotw{width:9px;height:9px;border-radius:50%;background:#ffb020;position:absolute;right:12px;top:50%;margin-top:-4px}
/* ---- 下のメニュー（縦長） ---- */
.bottom{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--nav);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.bottom button{flex:1;border:0;background:none;color:#cbd5e6;font-size:11px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:8px;min-height:54px;cursor:pointer;min-width:0;position:relative}
.bottom button.on{color:#fff;background:#33476b;font-weight:700}
.bottom .dotw{right:auto;left:50%;margin-left:9px;top:8px;margin-top:0}
main{flex:1;min-width:0;padding:calc(14px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 40px 18px}
@media (max-width:859px){
  .side{display:none} .bottom{display:flex}
  main{padding:calc(10px + env(safe-area-inset-top)) 12px 100px}
}
/* ---- 部品 ---- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.top h1{font-size:22px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 1px 2px rgba(20,30,50,.08);margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card h2 small{font-weight:400;font-size:13px;color:var(--sub)}
.muted{color:var(--sub)} .small{font-size:13px}
label.f{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);margin:14px 0 5px;font-weight:600}
.card>label.f:first-of-type{margin-top:0}
.inp{width:100%;border:1px solid #cbd1d8;border-radius:10px;padding:10px 12px;background:#fff;min-height:48px;font-size:16px}
textarea.inp{min-height:72px;resize:vertical;line-height:1.5}
.inp:focus{outline:2px solid var(--pri);outline-offset:0;border-color:var(--pri)}
.inp.sm{min-height:40px;padding:6px 10px;font-size:15px}
.inp.num{text-align:right;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #cbd1d8;background:#fff;border-radius:10px;padding:10px 16px;min-height:48px;cursor:pointer;font-size:16px;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none;color:var(--pri)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:14px}
.btn.wide{width:100%}
.btn.dash{border:2px dashed #b3bfd3;color:var(--pri);background:#fafbfd}
.btn svg.i{width:20px;height:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1 1 160px;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 auto;border:2px solid #cbd1d8;background:#fff;border-radius:10px;padding:8px 12px;min-height:48px;cursor:pointer;font-size:15px;font-weight:600}
.seg button.on{border-color:var(--pri);background:var(--pri-weak);color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 14px;font-size:15px;cursor:pointer;min-height:42px}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.chips.alg button.on{background:#b3261e;border-color:#b3261e}
.note{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--sub);margin-top:10px}
.note.warn{background:var(--warn-weak);color:var(--warn)}
.note.ok{background:var(--ok-weak);color:var(--ok)}
.note.bad{background:var(--bad-weak);color:var(--bad)}
.note.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.check{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;margin-top:4px}
.check input{width:22px;height:22px;flex-shrink:0}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--pri-weak);color:var(--pri);white-space:nowrap;font-weight:600;vertical-align:middle}
.badge.gray{background:#eceef1;color:var(--sub)}
.badge.warn{background:var(--warn-weak);color:var(--warn)}
.badge.red{background:var(--bad-weak);color:var(--bad)}
.actbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actbar.end{justify-content:flex-end;margin-top:6px}
.actbar .sp{flex:1}
.two{display:grid;gap:14px;grid-template-columns:1fr;align-items:start}
@media (min-width:1020px){ .two{grid-template-columns:1fr 1fr} }
.empty{text-align:center;color:var(--sub);padding:24px 10px}
.search{position:relative;margin-bottom:14px}
.search svg{position:absolute;left:12px;top:13px;color:var(--sub)}
.search .inp{padding-left:42px}
/* ---- メニュー一覧 ---- */
.it{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding:8px 0}
.grp h2+.it{border-top:0}
.mv{display:flex;flex-direction:column;gap:2px}
.mv button{width:40px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--sub)}
.mv button:disabled{opacity:.25;cursor:default}
.mv svg.i{width:18px;height:18px}
.it-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;cursor:pointer;padding:4px;border-radius:10px;min-height:64px}
.it-main:active{background:var(--soft)}
.th{width:76px;height:56px;border-radius:8px;overflow:hidden;flex-shrink:0;background:#e9e9e6;display:block}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:22px;opacity:.85}
.it-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.it-tx b{font-size:16px;line-height:1.3;overflow:hidden;text-overflow:ellipsis}
.lbs{display:flex;gap:4px;flex-wrap:wrap}
.lb{font-size:11px;font-weight:700;padding:0 6px;border-radius:5px;line-height:18px}
.lb.ok{background:var(--ok-weak);color:var(--ok)}
.lb.ng{background:#fff;color:var(--bad);border:1px dashed #e3a3a3}
.pr{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.sw{border:2px solid #cbd1d8;background:#fff;border-radius:10px;min-height:48px;padding:4px 10px;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;white-space:nowrap;min-width:84px}
.sw.on{background:var(--bad);border-color:var(--bad);color:#fff}
.it.sold .it-tx b{text-decoration:line-through;color:var(--sub)}
.it.hid .th{opacity:.4}
/* ---- 編集 ---- */
.ed-grid{display:grid;gap:14px;grid-template-columns:1fr;align-items:start}
@media (min-width:1020px){ .ed-grid{grid-template-columns:340px minmax(0,1fr)} }
.photo{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:4/3;border:2px dashed #b9c2cf;border-radius:12px;overflow:hidden;cursor:pointer;background:#fafbfc;text-align:center;color:var(--sub)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo svg.i{width:36px;height:36px}
.lgb{border-top:1px solid var(--line);padding:12px 0 4px}
.lgb:first-of-type{border-top:0;padding-top:0}
.lgb .lgh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.lgb .inp+.inp{margin-top:6px}
.opt{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--soft)}
.opt .inp.num{width:120px;flex:0 0 120px}
.opt-tr{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:6px}
.subh{font-size:13px;font-weight:700;color:var(--sub);margin:12px 0 6px}
/* ---- カテゴリ ---- */
.crow{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:10px 0}
.crow:first-of-type{border-top:0}
.crow .grow{flex:1;min-width:0}
/* ---- 翻訳 ---- */
.ttabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.ttabs button{border:2px solid #cbd1d8;background:#fff;border-radius:10px;padding:8px 14px;min-height:48px;font-weight:700;cursor:pointer}
.ttabs button.on{border-color:var(--pri);background:var(--pri);color:#fff}
.ttabs .cnt{display:inline-block;background:var(--bad);color:#fff;border-radius:999px;font-size:12px;padding:0 7px;margin-left:4px}
.ttabs button.on .cnt{background:#fff;color:var(--bad)}
.bar{height:10px;border-radius:5px;background:#e6e8ec;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--ok)}
.tf{border-top:1px solid var(--line);padding:12px 0}
.tf:first-of-type{border-top:0}
.tf-h{font-size:13px;color:var(--sub);margin-bottom:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tf-ja{font-weight:700;margin-bottom:6px;white-space:pre-wrap}
.tf-in{display:flex;gap:8px;align-items:flex-start}
.tf-in .inp{flex:1}
/* ---- 設定 ---- */
.mlrow{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.mlrow .ml{width:56px;flex-shrink:0;font-size:12px;font-weight:700;color:var(--sub);padding-top:14px;text-align:right}
.swatch{display:flex;gap:10px;flex-wrap:wrap}
.swatch button{width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #ccc;cursor:pointer}
.swatch button.on{box-shadow:0 0 0 3px var(--ink)}
/* ---- 印刷 ---- */
.pr-grid{display:grid;gap:14px;grid-template-columns:1fr;align-items:start}
@media (min-width:1100px){ .pr-grid{grid-template-columns:330px minmax(0,1fr)} }
.pv-wrap{overflow:hidden;background:#d9d9d6;border-radius:12px;padding:12px}
.paper{width:210mm;min-height:297mm;padding:10mm;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);margin:0 auto}
.paper.pop-pv{padding:0}
/* ---- QR・公開 ---- */
.qrbig{width:min(320px,100%);margin:0 auto 10px}
.qrbig svg{width:100%;height:auto;display:block}
.url{text-align:center;word-break:break-all;font-size:14px;color:var(--sub);margin-bottom:12px}
.step{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0;padding-top:0}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step .b{flex:1;min-width:0}
details.more{margin-top:12px}
details.more summary{cursor:pointer;font-weight:700;color:var(--pri);min-height:40px;display:flex;align-items:center}
/* ---- モーダル・通知 ---- */
#modal{position:fixed;inset:0;z-index:100;display:none;background:rgba(10,15,25,.5);align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
#modal .box{background:#fff;border-radius:16px;padding:20px;width:min(560px,100%);max-height:92vh;overflow-y:auto}
#modal .box h2{margin:0 0 12px;font-size:19px}
#modal .box .btn.wide{margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:200;background:#222;color:#fff;border-radius:12px;padding:12px 18px;display:none;align-items:center;gap:14px;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:92vw}
#toast.show{display:flex}
#toast button{background:none;border:0;color:#ffd166;font-weight:700;cursor:pointer;min-height:36px}

/* =========================================================
   お客さま表示（スマホ・タブレット共通）
   ========================================================= */
.vw{--c:#1f3a6e;width:100%;min-height:100vh;background:#f8f6f1;color:#222;font-family:system-ui,-apple-system,"Noto Sans JP","Noto Sans CJK JP",sans-serif}
.vw.serif{font-family:"Noto Serif CJK JP","Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif}
.vh{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.vh-top{display:flex;align-items:center;gap:10px 14px;padding:calc(10px + env(safe-area-inset-top)) 16px 6px;max-width:1200px;margin:0 auto;flex-wrap:wrap}
.vh-t{min-width:0}
.vh h1{font-size:21px;margin:0;color:var(--c);line-height:1.25}
.vh .vsub{font-size:12px;color:#777}
.vlang{display:flex;gap:6px;overflow-x:auto;margin-left:auto;scrollbar-width:none;max-width:100%}
.vlang button{border:1px solid #d6d6d6;background:#fff;border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap;min-height:40px;cursor:pointer;font-family:system-ui,sans-serif}
.vlang button.on{background:var(--c);border-color:var(--c);color:#fff;font-weight:700}
.vcats{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 10px;max-width:1200px;margin:0 auto;scrollbar-width:none}
.vcats::-webkit-scrollbar,.vlang::-webkit-scrollbar{display:none}
.vcats button{border:0;background:#f0eee9;border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap;min-height:40px;cursor:pointer;font-weight:600;color:#444}
.vcats button.on{background:var(--c);color:#fff}
.vmain{max-width:1200px;margin:0 auto;padding:4px 12px 110px}
.vnote{background:#fff;border-left:4px solid var(--c);border-radius:8px;padding:10px 14px;margin:12px 0 0;font-size:14px;white-space:pre-wrap}
.vsec h2{font-size:19px;margin:22px 4px 10px;border-left:5px solid var(--c);padding-left:10px;line-height:1.3}
.vsec h2 small{font-size:12px;color:#888;font-weight:400;margin-left:6px}
.vgrid{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:700px){ .vgrid{grid-template-columns:1fr 1fr} }
@media (min-width:1300px){ .vw.kiosk .vgrid{grid-template-columns:1fr 1fr 1fr} }
.vcard{display:flex;gap:12px;background:#fff;border:0;border-radius:14px;padding:10px;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;width:100%;color:inherit;font:inherit;align-items:stretch}
.vimg{width:110px;height:110px;border-radius:10px;overflow:hidden;flex-shrink:0;background:#eee;position:relative}
.vw.kiosk .vimg{width:150px;height:130px}
.vimg img{width:100%;height:100%;object-fit:cover;display:block}
.vimg .ph{font-size:34px}
.vtx{flex:1;min-width:0;display:flex;flex-direction:column}
.vname{font-weight:700;font-size:17px;line-height:1.3}
.vja{font-size:13px;color:#777;line-height:1.3;margin-top:1px}
.vdesc{font-size:13px;color:#555;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45}
.vbot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding-top:6px}
.vprice{font-weight:700;font-size:18px;color:var(--c);white-space:nowrap;font-family:system-ui,sans-serif}
.vtags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:3px}
.tg{font-size:11px;font-weight:700;color:#fff;padding:1px 7px;border-radius:4px;line-height:18px;font-family:system-ui,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.valg{font-size:11px;color:#9a3b30;text-align:right;line-height:1.3}
.vcard.sold{opacity:.6}
.soldlab{position:absolute;inset:auto 0 0 0;background:rgba(150,20,20,.88);color:#fff;font-size:12px;font-weight:700;text-align:center;padding:3px 0;font-family:system-ui,sans-serif}
.vfoot{max-width:1200px;margin:24px auto 0;padding:16px;text-align:center;font-size:12px;color:#777;border-top:1px solid #ddd}
.vfoot p{margin:3px 0}
.vfab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:25;border:0;background:#fff;color:#9a3b30;border-radius:999px;padding:10px 18px;min-height:50px;font-weight:700;box-shadow:0 3px 12px rgba(0,0,0,.2);display:flex;align-items:center;gap:6px;cursor:pointer;font-family:system-ui,sans-serif;font-size:15px}
.vfab.on{background:#9a3b30;color:#fff}
.vempty{text-align:center;color:#888;padding:40px 10px}
.kx{position:fixed;left:0;bottom:0;width:70px;height:70px;z-index:30;border:0;background:none;color:rgba(0,0,0,.18);font-size:10px;display:flex;align-items:flex-end;justify-content:flex-start;padding:0 0 calc(6px + env(safe-area-inset-bottom)) 6px;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.kx.hold{color:#c00}
/* 詳しく見る（下から出る） */
#modal.sheet{align-items:flex-end;padding:0}
#modal.sheet .box{border-radius:18px 18px 0 0;width:min(640px,100%);padding:0 0 calc(16px + env(safe-area-inset-bottom));max-height:94vh}
@media (min-width:700px){ #modal.sheet{align-items:center;padding:16px} #modal.sheet .box{border-radius:18px} }
.vwd{--c:#1f3a6e;color:#222}
.vwd.serif{font-family:"Noto Serif CJK JP","Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif}
.vd-img{width:100%;aspect-ratio:4/3;max-height:45vh;object-fit:cover;display:block;background:#eee}
.vd{padding:16px 18px 0}
.vd h3{font-size:22px;margin:4px 0 2px;line-height:1.3}
.vd .vprice{font-size:22px}
.vd p{margin:10px 0;white-space:pre-wrap;color:#444;line-height:1.6}
.vd-sec{margin-top:12px;font-size:14px}
.vd-sec b{display:block;font-size:13px;color:#777;margin-bottom:4px}
.vd-sec ul{margin:0;padding:0;list-style:none}
.vd-sec li{display:flex;justify-content:space-between;border-bottom:1px dotted #ccc;padding:5px 0}
.algc{display:inline-block;background:#fbe9e7;color:#9a3b30;border-radius:6px;padding:3px 9px;margin:0 4px 4px 0;font-weight:700;font-size:14px}
.vd-staff{margin-top:14px;background:#fff8e6;border:1px solid #f0d58a;border-radius:12px;padding:12px;text-align:center}
.vd-staff small{display:block;color:#8a6d1a;font-size:13px}

  req(mode, fn) { return new Promise((res, rej) => { if (!this.db) return rej(new Error('no db')); const r = fn(this.db.transaction('img', mode).objectStore('img')); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  put(id, v) { return this.req('readwrite', s => s.put(v, id)); },

  clear() { return this.req('readwrite', s => s.clear()); },
  all() { return new Promise((res, rej) => { if (!this.db) return res({}); const out = {}; const r = this.db.transaction('img').objectStore('img').openCursor(); r.onsuccess = () => { const c = r.result; if (c) { out[c.key] = c.value; c.continue(); } else res(out); }; r.onerror = () => rej(r.error); }); }

/* メニューの置き場所（お店ごとのリポジトリ）
   アプリ本体は開発者のリポジトリ1つ。お店のメニュー（menu.json）は、お店ごとの「置き場所リポジトリ」に入れる。
   お客さま用のアドレスは  アプリのアドレス?m=持ち主/リポジトリ名  （持ち主がアプリと同じなら ?m=リポジトリ名 だけ） */
const REPO_RE = /^([a-z0-9](?:[a-z0-9-]{0,38}))\/([\w.-]{1,100})$/i;
function parseRepo(s) {
  s = String(s || '').trim().replace(/^https?:\/\/(www\.)?github\.com\//i, '').replace(/\.git$/i, '').replace(/[?#].*$/, '').replace(/\/+$/, '');
  const m = REPO_RE.exec(s.split('/').slice(0, 2).join('/'));
  return m ? {owner: m[1], repo: m[2], full: `${m[1]}/${m[2]}`} : null;
}
const appOwner = () => { const m = /^([a-z0-9-]+)\.github\.io$/i.exec(location.hostname); return m ? m[1].toLowerCase() : ''; };
function ownerOf(u) { const m = /^https:\/\/([a-z0-9-]+)\.github\.io\//i.exec(u || ''); return m ? m[1].toLowerCase() : ''; }
// お客さま用のアドレス（QRコードの中身）
function qrTarget() {
  const r = parseRepo(S.shop.dataRepo), u = S.shop.pubUrl; if (!r || !u) return '';
  return u + '?m=' + (r.owner.toLowerCase() === ownerOf(u) ? r.repo : r.full);
}
// ?m=… から、menu.json を読む場所を決める（上から順にためす）
//  1. GitHub API … 公開した直後でも最新が出る（ただし同じ回線から1時間60回まで）
//  2. raw.githubusercontent.com … 回数の上限なし（ただし最大5分古いことがある）
function menuSrcs(m) {
  if (!m) return [{url: 'menu.json?t=' + Date.now()}];   // 前の形（アプリと同じ場所の menu.json）
  const full = m.includes('/') ? m : (appOwner() ? `${appOwner()}/${m}` : '');
  const r = parseRepo(full); if (!r) return [];
  return [{url: `https://api.github.com/repos/${r.owner}/${r.repo}/contents/menu.json`, api: true},
          {url: `https://raw.githubusercontent.com/${r.owner}/${r.repo}/HEAD/menu.json`}];
}
async function loadMenu(m, tok) {
  let last = new Error('no source');
  for (const s of menuSrcs(m)) {
    try {
      const h = s.api ? Object.assign({Accept: 'application/vnd.github.raw+json'}, tok ? {Authorization: 'Bearer ' + tok} : {}) : {};
      const r = await fetch(s.url, {cache: 'no-store', headers: h});
      if (r.ok) return await r.json();
      last = new Error(r.status);
      if (r.status === 404) break;   // まだ公開されていない
    } catch (e) { last = e; }
  }
  throw last;
}
function normUrl(u) {
  u = (u || '').trim(); if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  u = u.replace(/[?#].*$/, '').replace(/index\.html$/i, '');
  if (!u.endsWith('/')) u += '/';
  return u;
}
function b64utf8(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
async function ghPublish() {
  const gh = parseRepo(S.shop.dataRepo), tok = getTok();
  if (!gh) throw new Error('メニューの置き場所（持ち主/リポジトリ名）が入っていません。');
  if (!tok) throw new Error('GitHubの鍵（トークン）が入っていません。');
  const data = await buildPublic(UI.pubImg);
  const json = JSON.stringify(data);
  const api = `https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/menu.json`;
  const h = {Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github+json'};
  const why = s => s === 401 ? '鍵（トークン）が違うか、期限が切れています。' : (s === 403 || s === 404) ? `鍵に「${gh.full}」へ書き込む許可がないか、リポジトリの名前が違います。` : s === 409 ? 'リポジトリが空のようです。GitHubでリポジトリを作るときに「Add a README file」をオンにしてください。' : `GitHubでエラーが起きました（${s}）。`;
  let sha;
  const r0 = await fetch(api, {headers: h, cache: 'no-store'});
  if (r0.ok) sha = (await r0.json()).sha; else if (r0.status !== 404) throw new Error(why(r0.status));
  const r = await fetch(api, {method: 'PUT', headers: Object.assign({'Content-Type': 'application/json'}, h),
    body: JSON.stringify(Object.assign({message: 'メニューを更新 ' + fmt(Date.now()), content: b64utf8(json)}, sha ? {sha} : {}))});
  if (!r.ok) throw new Error(why(r.status));
  S.pubBuilt = data.updated; S.pubAt = Date.now(); save(false);
  return Math.round(json.length / 1024);
}
async function checkPublic() {
  const r0 = parseRepo(S.shop.dataRepo); if (!r0) throw new Error('no repo');
  return loadMenu(r0.full, getTok());   // 鍵があれば回数の上限を気にせず最新を確かめられる
}

  add('お店', '店名', S.shop.name); add('お店', 'キャッチコピー', S.shop.catch); add('お店', 'お知らせ', S.shop.note, true);

function qrPng() {
  const M = QR.encode(qrTarget()); if (!M) return;
  const n = M.length, q = 4, sc = 12, c = document.createElement('canvas'); c.width = c.height = (n + q * 2) * sc;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.fillStyle = '#000';
  for (let y = 0; y < n; y++) for (let i = 0; i < n; i++) if (M[y][i]) x.fillRect((i + q) * sc, (y + q) * sc, sc, sc);
  c.toBlob(b => download('メニューQRコード.png', b));
}

  for (const w of want) {
    let c = w.startsWith('ja') ? 'ja' : w.startsWith('en') ? 'en' : w.startsWith('ko') ? 'ko' : w.startsWith('th') ? 'th'
      : w.startsWith('zh') ? (/(tw|hk|mo|hant)/.test(w) ? 'zh' : 'zhs') : '';
    if (c && !langs.includes(c) && SIB[c] && langs.includes(SIB[c])) c = SIB[c];
    if (c && langs.includes(c)) return c;
    if (c === 'ja') break;
  }
  return langs.includes('en') && !want[0].startsWith('ja') ? 'en' : 'ja';
}

    try { localStorage.setItem(TOK_KEY, v); } catch (e) {} render(); toast('鍵を保存しました');
  },
  delTok: () => { if (!confirm('このタブレットから鍵を消しますか？')) return; try { localStorage.removeItem(TOK_KEY); } catch (e) {} render(); },
  publish: async el => {
    if (!S.items.length) { toast('メニューがまだありません'); return; }
    el.disabled = true; UI.pub = {s: 'busy', m: '公開しています…'}; render();
    try { const kb = await ghPublish(); UI.pub = {s: 'ok', m: `公開しました（${kb}KB）。お客さまのスマホにはすぐ出ます（混みあう時間は数分おくれることがあります）。`}; }
    catch (e) { UI.pub = {s: 'err', m: navigator.onLine === false ? 'ネットにつながっていません。つながる場所でもう一度どうぞ。' : (e.message || '公開できませんでした')}; }
    render();
  },
  buildPub: async () => {
    if (!S.items.length) { toast('メニューがまだありません'); return; }
    const d = await buildPublic(UI.pubImg), s = JSON.stringify(d);
    download('menu.json', new Blob([s], {type: 'application/json'}));
    S.pubBuilt = d.updated; S.pubAt = Date.now(); save(false); render(); toast(`menu.json を作りました（${Math.round(s.length / 1024)}KB）`);
  },
  checkPub: async () => {
    UI.pub = {s: 'busy', m: '確かめています…'}; render();
    try {
      const d = await checkPublic();
      if ((d.updated || 0) >= (S.updated || 0)) UI.pub = {s: 'ok', m: `最新のメニュー（${d.items.length}品）が公開されています。`};
      else UI.pub = {s: 'old', m: `公開中のメニューは ${fmt(d.updated)} の内容です。公開したばかりなら少し待ってからもう一度。そうでなければ「公開する」を。`};
    } catch (e) { UI.pub = {s: 'err', m: navigator.onLine === false ? 'ネットにつながっていません。' : 'まだ公開されていないか、アドレスが違うようです。'}; }
    render();
  },
  // お客さま表示
  vLang: el => { VS.lang = el.dataset.l; const y = window.scrollY; render(); window.scrollTo(0, y); },
  vCat: el => { const s = document.getElementById('vc-' + el.dataset.id); if (!s) return; const hh = $('.vh').offsetHeight; window.scrollTo({top: s.getBoundingClientRect().top + window.scrollY - hh - 4, behavior: 'smooth'}); },
  vItem: el => vDetail(el.dataset.id),
  vFilter: () => vFilter(),
  vAvoid: el => { const k = el.dataset.k; VS.avoid = VS.avoid.includes(k) ? VS.avoid.filter(x => x !== k) : [...VS.avoid, k]; el.classList.toggle('on'); render(); },
  vFilterDone: () => { closeModal(); render(); },
  vClear: () => { VS.avoid = []; render(); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = A[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.d != null && UI.draft) {
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (el.hasAttribute('data-num')) v = parseInt(v, 10) || 0;
    setPath(UI.draft, el.dataset.d, v); UI.dirty = true;
  } else if (el.dataset.m != null && UI.mdraft) setPath(UI.mdraft, el.dataset.m, el.value);
  else if (el.dataset.s != null && !el.hasAttribute('data-url') && !el.hasAttribute('data-repo')) { setPath(S, el.dataset.s, el.value); saveSoon(); }
  else if (el.dataset.tf != null) { const f = transFields()[Number(el.dataset.tf)]; if (f) { f.obj[UI.tl] = el.value; saveSoon(); } }
  else if (el.hasAttribute('data-q')) {
    const q = el.value.trim().toLowerCase();
    document.querySelectorAll('.grp').forEach(g => {
      let n = 0; g.querySelectorAll('.it').forEach(r => { const hit = !q || r.dataset.k.includes(q); r.style.display = hit ? '' : 'none'; if (hit) n++; });
      g.style.display = n || !q ? '' : 'none';
    });
  }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.d === 'cat' && UI.draft) { UI.draft.cat = el.value; UI.dirty = true; }
  if (el.dataset.d != null && el.type === 'checkbox' && UI.draft) { setPath(UI.draft, el.dataset.d, el.checked); UI.dirty = true; }
  if (el.hasAttribute('data-url')) { S.shop.pubUrl = normUrl(el.value); UI.pub = null; save(false); render(); }
  if (el.hasAttribute('data-repo')) { const r = parseRepo(el.value); S.shop.dataRepo = r ? r.full : el.value.trim(); UI.pub = null; S.pubBuilt = 0; S.pubAt = 0; save(false); render(); }
  if (el.dataset.s != null && !el.hasAttribute('data-url') && !el.hasAttribute('data-repo')) { clearTimeout(saveTimer); save(); if (el.dataset.s.startsWith('shop.name')) render(); }
  if (el.dataset.ch === 'lang') {
    const l = el.dataset.l, set = new Set(S.shop.langs); el.checked ? set.add(l) : set.delete(l); set.add('ja');
    S.shop.langs = LANGS.map(x => x.c).filter(c => set.has(c)); save(); render();
  }
  if (el.dataset.ch === 'tMissing') { UI.tMissing = el.checked; render(); }
  if (el.dataset.ch === 'pubImg') UI.pubImg = el.checked;
  if (el.dataset.ch === 'pr') { UI.pr[el.dataset.k] = el.checked; render(); }
  if (el.dataset.file === 'itemImg' && el.files[0]) {
    try { const raw = await fileToData(el.files[0]); UI.draftImg = await shrink(raw, 1000, 0.82); UI.dirty = true; render(); }
    catch (err) { toast('この写真は読み込めませんでした'); }
  }
  if (el.dataset.file === 'restore' && el.files[0]) { const f = el.files[0]; el.value = ''; await restoreFile(f); }
});
window.addEventListener('beforeunload', e => { if (UI.page === 'edit' && UI.dirty) { e.preventDefault(); e.returnValue = ''; } });

/* =========================================================
   はじめに
   ========================================================= */
const PUBLIC_VIEW = /[?&]m(=|&|$)/.test(location.search);
(async () => {
  if (PUBLIC_VIEW) { await startPublicView(); }
  else {
    try {
      await IDB.open(); IMG = await IDB.all();
      // どのメニューにも使われていない写真を片づける
      const used = new Set(S.items.map(i => i.img).filter(Boolean));
      for (const k of Object.keys(IMG)) if (!used.has(k)) { IDB.del(k).catch(() => {}); delete IMG[k]; }
    } catch (e) { console.warn(e); }
    if (!S.shop.pubUrl && /\.github\.io$/i.test(location.hostname)) { S.shop.pubUrl = normUrl(location.origin + location.pathname); save(false); }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    render();
  }
  if ('serviceWorker' in navigator && location.protocol !== 'file:') setupUpdate();
})();

/* ---------- アプリの更新 ----------
   開発者が新しい版（sw.js の版番号を上げたもの）を置くと、
   アプリを開いたとき・画面に戻ったとき・30分ごとに気づいて、自動で新しい版に切りかえる */
let reloadPending = false;
function safeToReload() { return !PUBLIC_VIEW && UI.page !== 'kiosk' && !(UI.page === 'edit' && UI.dirty) && !$('#modal').classList.contains('show') && !document.body.matches('.printing'); }
function reloadNow() { try { sessionStorage.setItem('menu_pwa_page', ['edit', 'kiosk'].includes(UI.page) ? 'menu' : UI.page); } catch (e) {} location.reload(); }
function tryReload() { if (reloadPending && safeToReload()) reloadNow(); }
async function setupUpdate() {
  const hadController = !!navigator.serviceWorker.controller;
  let reg; try { reg = await navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}); } catch (e) { return; }
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController) return;            // はじめて入れたときは何もしない
    if (PUBLIC_VIEW) return;               // お客さまのスマホは次に開いたときに新しい版
    reloadPending = true;
    if (safeToReload()) reloadNow(); else toast('新しい版があります。いまの作業が終わると自動で切りかわります');
  });
  const check = () => { if (navigator.onLine !== false) reg.update().catch(() => {}); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
  setInterval(check, 30 * 60 * 1000);
}
try { const p = sessionStorage.getItem('menu_pwa_page'); if (p) { sessionStorage.removeItem('menu_pwa_page'); if (!PUBLIC_VIEW && NAV.some(n => n[0] === p)) UI.page = p; } } catch (e) {}
</script>
